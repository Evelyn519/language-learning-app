<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Build your English skills with academic vocabulary, short readings, and advanced quizzes.">
  <title>Wordwell · English Learning</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="data/levels.js"></script>
  <script defer src="data/dictionary.js"></script>
  <script defer src="data/readings.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell header">
      <a class="brand" href="#home"><span class="logo" aria-hidden="true">W</span> Wordwell<span class="brand-caption">English Learning</span></a>
      <nav aria-label="Main navigation">
        <a href="#home" data-tab="home">Home</a>
        <a href="#words" data-tab="words">Vocabulary</a>
        <a href="#reading" data-tab="reading">Reading</a>
        <a href="#quiz" data-tab="quiz">Quizzes</a>
      </nav>
      <div class="header-controls">
      <label class="level"><span id="level-label">Study level</span><select id="level">
        <option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option>
      </select></label>
      <label class="level"><span class="sr-only" id="language-label">Language</span><select id="language">
        <option value="en" lang="en">English</option><option value="zh-Hant" lang="zh-Hant">繁體中文</option>
      </select></label>
      </div>
    </div>
  </header>
  <main class="shell" id="app"></main>
  <p class="sr-only" id="status" role="status"></p>
  <footer class="shell footer"><span>Wordwell · GEAP103</span><a href="#credits">Learning resources</a></footer>
</body>
</html>
