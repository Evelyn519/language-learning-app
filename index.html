<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="透過學術單字、英文短文與進階測驗，建立自己的英語學習進度。">
  <title>Wordwell · 英語學習</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="data/levels.js"></script>
  <script defer src="data/dictionary.js"></script>
  <script defer src="data/readings.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell header">
      <a class="brand" href="#home"><span class="logo" aria-hidden="true">W</span> Wordwell<span class="brand-caption">英語學習</span></a>
      <nav aria-label="主要導覽">
        <a href="#home" data-tab="home">首頁</a>
        <a href="#words" data-tab="words">單字</a>
        <a href="#reading" data-tab="reading">閱讀</a>
        <a href="#quiz" data-tab="quiz">測驗</a>
      </nav>
      <label class="level"><span>學習程度</span><select id="level" aria-label="學習程度">
        <option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option>
      </select></label>
    </div>
  </header>
  <main class="shell" id="app"></main>
  <p class="sr-only" id="status" role="status"></p>
  <footer class="shell footer"><span>Wordwell · GEAP103</span><a href="#credits">教材來源</a></footer>
</body>
</html>
